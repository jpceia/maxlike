[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "maxlike"
dynamic = ["version"]
description = "Maximum likelihood (and general score) optimisation with exact, structure-aware second-order derivatives"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "joao ceia", email = "joao.p.ceia@gmail.com" }]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/jpceia/maxlike"
Issues = "https://github.com/jpceia/maxlike/issues"

[tool.setuptools.packages.find]
include = ["maxlike*"]

[tool.setuptools.dynamic]
version = { attr = "maxlike.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
