name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}${{ matrix.deps == 'minimum' && ' (minimum deps)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: ["latest"]
        include:
          # oldest supported dependency versions (see pyproject.toml)
          - python-version: "3.10"
            deps: "minimum"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "minimum" ]; then
            pip install "numpy==1.21.6" "scipy==1.7.3" "pandas==1.3.5"
          fi
          pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest tests --cov=maxlike --cov-report=term-missing
